<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Gradient: Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Gradient: Accent (cyan to purple) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff6bd6"/>
    </linearGradient>

    <!-- Gradient: Title -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5ee7ff"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <!-- Scan line pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Decorative corner brackets -->
  <g stroke="#5ee7ff" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 30 30 L 30 70 M 30 30 L 70 30"/>
    <path d="M 1170 30 L 1170 70 M 1170 30 L 1130 30"/>
    <path d="M 30 370 L 30 330 M 30 370 L 70 370"/>
    <path d="M 1170 370 L 1170 330 M 1170 370 L 1130 370"/>
  </g>

  <!-- Top status bar -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#5ee7ff" opacity="0.7">
    <text x="50" y="55">┌─[alexandria@lab]─[~]</text>
    <text x="290" y="55">─────────────────────────────────────</text>
    <circle cx="1120" cy="51" r="4" fill="#ff5f56"/>
    <circle cx="1140" cy="51" r="4" fill="#ffbd2e"/>
    <circle cx="1160" cy="51" r="4" fill="#27c93f"/>
  </g>

  <!-- Main Shield / Eye Icon -->
  <g transform="translate(140, 200)">
    <!-- Outer hexagon -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40"
             fill="none" stroke="url(#accentGrad)" stroke-width="3"
             filter="url(#glow)" opacity="0.9"/>
    <!-- Inner hexagon -->
    <polygon points="0,-55 48,-28 48,28 0,55 -48,28 -48,-28"
             fill="#0d1117" stroke="#5ee7ff" stroke-width="1.5" opacity="0.8"/>
    <!-- Eye -->
    <ellipse cx="0" cy="0" rx="30" ry="18" fill="none" stroke="#5ee7ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="10" fill="#5ee7ff" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#0d1117"/>
    <!-- Pupil animation -->
    <animateTransform attributeName="transform" type="rotate"
                      from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"
                      additive="sum"/>
  </g>

  <!-- Title: Alexandria -->
  <text x="290" y="175"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="72" font-weight="800"
        fill="url(#titleGrad)"
        filter="url(#softGlow)"
        letter-spacing="-1">
    Alexandria
  </text>

  <!-- Subtitle -->
  <text x="290" y="215"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="16" font-weight="400"
        fill="#8b949e"
        letter-spacing="3">
    LABORATORY ACTIVITY MONITOR · v2.0
  </text>

  <!-- Divider line -->
  <line x1="290" y1="235" x2="1150" y2="235" stroke="#30363d" stroke-width="1" opacity="0.6"/>

  <!-- Tagline -->
  <text x="290" y="265"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="14" font-weight="400"
        fill="#c9d1d9" opacity="0.85">
    Monitor the system. Capture the activity. Prove the integrity.
  </text>

  <!-- Terminal-style command line -->
  <g transform="translate(290, 300)" font-family="'Courier New', monospace" font-size="13">
    <text x="0" y="0" fill="#7ee787">$</text>
    <text x="15" y="0" fill="#c9d1d9">alexandria</text>
    <text x="110" y="0" fill="#79c0ff">--monitor</text>
    <text x="210" y="0" fill="#79c0ff">--duration</text>
    <text x="310" y="0" fill="#ffa657">7d</text>
    <text x="345" y="0" fill="#79c0ff">--output</text>
    <text x="430" y="0" fill="#a5d6ff">usb://logs_export</text>
    <!-- Blinking cursor -->
    <rect x="560" y="-12" width="8" height="14" fill="#5ee7ff">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Feature pills -->
  <g transform="translate(290, 340)" font-family="'Segoe UI', Arial, sans-serif" font-size="11">
    <!-- Pill 1: 9 Log Types -->
    <rect x="0" y="0" rx="12" ry="12" width="130" height="22" fill="#0d1117" stroke="#5ee7ff" stroke-width="1"/>
    <text x="65" y="15" fill="#5ee7ff" text-anchor="middle" font-weight="600">9 LOG TYPES</text>

    <!-- Pill 2: SHA-256 -->
    <rect x="145" y="0" rx="12" ry="12" width="110" height="22" fill="#0d1117" stroke="#7ee787" stroke-width="1"/>
    <text x="200" y="15" fill="#7ee787" text-anchor="middle" font-weight="600">SHA-256</text>

    <!-- Pill 3: MITRE -->
    <rect x="270" y="0" rx="12" ry="12" width="130" height="22" fill="#0d1117" stroke="#a78bfa" stroke-width="1"/>
    <text x="335" y="15" fill="#a78bfa" text-anchor="middle" font-weight="600">MITRE ATT&amp;CK</text>

    <!-- Pill 4: EN + FA -->
    <rect x="415" y="0" rx="12" ry="12" width="90" height="22" fill="#0d1117" stroke="#ff6bd6" stroke-width="1"/>
    <text x="460" y="15" fill="#ff6bd6" text-anchor="middle" font-weight="600">EN + FA</text>
  </g>

  <!-- Bottom-right version tag -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#484f58">
    <text x="1150" y="380" text-anchor="end">AUTHORIZED LABORATORY USE ONLY</text>
  </g>

  <!-- Animated scan line effect -->
  <rect x="0" y="0" width="1200" height="2" fill="#5ee7ff" opacity="0.3">
    <animate attributeName="y" from="0" to="400" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanlines overlay -->
  <rect width="1200" height="400" fill="url(#scanlines)" opacity="0.3"/>
</svg>